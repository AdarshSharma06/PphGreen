# Production profile (activate via SPRING_PROFILES_ACTIVE=prod on Render)
# Database settings are inherited from application.properties and are
# driven by Render environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).

# In production, do not let Hibernate alter the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Production frontend origin(s). Must be provided via Render env vars,
# e.g. CORS_ALLOWED_ORIGINS=https://pph-green.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT - environment driven
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}